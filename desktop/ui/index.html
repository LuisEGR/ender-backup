<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ender Backup</title>
<style>
  /* Shown only until the server answers; then the window switches to its settings page. */
  /* Woodland daylight, like the settings page's default. */
  :root { --bg: #FAF3E5; --ink: #362A23; --muted: #827563; --accent: #BB4639; --dot: #C94B3C; --danger: #B3261E; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .mark { display: block; width: 200px; height: 55px; margin: 0 auto 6px; color: var(--ink); }
  .mark circle { fill: var(--dot); }
  .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .spin {
    width: 26px; height: 26px; margin: 34px auto 14px; border-radius: 50%;
    border: 3px solid color-mix(in srgb, var(--muted) 30%, transparent); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #msg { color: var(--muted); font-size: 14px; max-width: 420px; margin: 0 auto; line-height: 1.45; }
  #msg.err { color: var(--danger); }
</style>
</head>
<body>

    <div class="sub">Photo &amp; video backup</div>
    <div class="spin" id="spin"></div>
    <p id="msg">Starting…</p>
  </div>
</body>
</html>
